{% if cell.kind == "badge" %}<span class="badge-soft-{{ cell.tone }}">{{ cell.text }}</span>{% elif cell.kind == "bool" %}{% if cell.value %}<i class="fas fa-circle-check text-success" title="Yes"></i>{% else %}<i class="fas fa-circle-xmark text-muted" title="No"></i>{% endif %}{% elif cell.kind == "file" %}<a href="{{ cell.url }}" target="_blank" rel="noopener">{{ cell.text }}</a>{% else %}{{ cell.text }}{% endif %}
